<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeaceCoin Protocol</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        p {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .link-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #667eea;
            transform: translateY(-5px);
        }
        .link-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        .link-card p {
            margin: 0;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PeaceCoin Protocol</h1>
        <p>Building the future of decentralized governance with peace and prosperity</p>
        
        <div class="links">
            <a href="wrapper/" class="link-card">
                <h2>WPCE Wrapper</h2>
                <p>Wrap your PCE tokens for DAO governance voting</p>
            </a>
            <a href="voucher/" class="link-card">
                <h2>Voucher</h2>
                <p>Create and manage voucher campaigns</p>
            </a>
            <a href="managetoken/" class="link-card">
                <h2>Manage Token</h2>
                <p>Register, swap, and configure community tokens</p>
            </a>
        </div>
    </div>
</body>
</html>
